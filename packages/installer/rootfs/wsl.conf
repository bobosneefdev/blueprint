# No Windows drives, no launching Windows programs, no Windows PATH. The only host paths the agent
# sees are the two the bot mounts at boot (workspace + game data), see install.ps1.
[automount]
enabled = false
mountFsTab = false

[interop]
enabled = false
appendWindowsPath = false

[user]
default = agent

[boot]
command = /usr/local/sbin/egress-firewall
