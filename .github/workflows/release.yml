name: release

# Tag vX.Y.Z to publish. Everything users download is built here, in public, from the tagged
# source: checksums + build provenance attestations + a VirusTotal report link in the notes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  rootfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: bot CLI (musl, for the Alpine sandbox)
        run: cd packages/cli && bun run build && cp dist/bot ../installer/rootfs/bot
      - name: sandbox image
        run: |
          docker build -t blueprint-agent packages/installer/rootfs
          docker export "$(docker create blueprint-agent)" | gzip -9 > blueprint-agent.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: rootfs
          path: blueprint-agent.tar.gz

  app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install --frozen-lockfile
      - name: updater key configured
        shell: bash
        run: |
          if grep -q REPLACE_WITH_TAURI_SIGNER_PUBLIC_KEY apps/desktop/src-tauri/tauri.conf.json; then
            echo "::error::Set plugins.updater.pubkey in tauri.conf.json (see docs/release-setup.md)"; exit 1
          fi
      - name: version from tag
        shell: bash
        run: |
          f=apps/desktop/src-tauri/tauri.conf.json
          jq --arg v "${GITHUB_REF_NAME#v}" '.version = $v' "$f" > v.json && mv v.json "$f"
      - name: portal
        run: cd apps/portal && bun run build
      - name: sidecar
        shell: bash
        run: |
          cd apps/bot && bun run build
          mkdir -p ../desktop/src-tauri/binaries
          cp dist/blueprint-bot.exe ../desktop/src-tauri/binaries/blueprint-bot-x86_64-pc-windows-msvc.exe
      - name: sidecar self-test (from outside the checkout, like a player's PC)
        shell: pwsh
        run: |
          $t = Join-Path $env:RUNNER_TEMP "selftest"
          New-Item -ItemType Directory -Force $t | Out-Null
          Copy-Item apps/bot/dist/blueprint-bot.exe $t
          Push-Location $t
          & .\blueprint-bot.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw "sidecar self-test failed" }
      - name: bundle MinGit (git for the plugin workspace; most players have none)
        shell: pwsh
        run: |
          $u = "https://github.com/git-for-windows/git/releases/download/v2.56.0.windows.2/MinGit-2.56.0.2-64-bit.zip"
          Invoke-WebRequest $u -OutFile mingit.zip
          Expand-Archive mingit.zip apps/desktop/src-tauri/mingit
      - name: tray app + installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cd apps/desktop && bunx tauri build
      - name: collect
        shell: bash
        run: |
          mkdir out
          cp apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe out/blueprint-setup.exe
          cp apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sig out/blueprint-setup.exe.sig
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: out/*

  publish:
    needs: [rootfs, app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: updater manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/blueprint-setup.exe"
          jq -n --arg v "$VERSION" --arg url "$URL" --rawfile sig dist/blueprint-setup.exe.sig \
            '{version: $v, platforms: {"windows-x86_64": {url: $url, signature: $sig}}}' > dist/latest.json
          cp packages/installer/install.ps1 dist/install.ps1
      - name: checksums
        run: cd dist && sha256sum blueprint-setup.exe blueprint-agent.tar.gz install.ps1 > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/blueprint-setup.exe
            dist/blueprint-agent.tar.gz
            dist/install.ps1
      - name: VirusTotal
        id: vt
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          if [ -z "$VT_API_KEY" ]; then echo "report=(VirusTotal key not configured)" >> "$GITHUB_OUTPUT"; exit 0; fi
          SHA=$(sha256sum dist/blueprint-setup.exe | cut -d' ' -f1)
          UPLOAD=$(curl -s -H "x-apikey: $VT_API_KEY" https://www.virustotal.com/api/v3/files/upload_url | jq -r .data)
          curl -s -H "x-apikey: $VT_API_KEY" -F "file=@dist/blueprint-setup.exe" "$UPLOAD" > /dev/null
          echo "report=https://www.virustotal.com/gui/file/$SHA" >> "$GITHUB_OUTPUT"
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          Install: \`powershell -ExecutionPolicy ByPass -c "irm https://blueprint.bobosneef.dev/install.ps1 | iex"\` (same file as install.ps1 below)

          - Built by this workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Verify: \`gh attestation verify blueprint-setup.exe -R ${GITHUB_REPOSITORY}\`
          - VirusTotal: ${{ steps.vt.outputs.report }}
          - The installer is not code-signed yet; Windows SmartScreen will warn. Checksums are in SHA256SUMS.
          EOF
          # vX.Y.Z-beta.N tags are prereleases: /releases/latest (installer + updater) skips them.
          PRE=$([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md $PRE

  site:
    # Landing page + docs + gallery index on Cloudflare Pages.
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: cd apps/site && bun run build && cp ../../packages/installer/install.ps1 build/install.ps1
      - run: bunx wrangler pages deploy apps/site/build --project-name blueprint --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
